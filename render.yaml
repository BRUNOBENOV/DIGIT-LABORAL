services:
  - type: web
    name: digit-laboral-app
    runtime: docker
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DIGIT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_URL
        value: https://digit-laboral-app.onrender.com
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: JSON_LOGS
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: AI_STORE_RESPONSES
        value: "false"
      - key: MAX_LOGO_SIZE
        value: "8388608"
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
      - key: MAX_IMPORT_ROWS
        value: "2000"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: RLS_ENABLED
        value: "true"
      - key: RLS_FORCE
        value: "false"
      - key: CSRF_ENABLED
        value: "true"
      - key: COMPLIANCE_DUAL_APPROVAL
        value: "false"
      - key: STORAGE_BACKEND
        value: "local"
      - key: LOCAL_STORAGE_PATH
        value: "/app/data/uploads"
      - key: REI_DIRECT_ENABLED
        value: "false"
      - key: REOP_DIRECT_ENABLED
        value: "false"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: "Administrador General"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Digit Laboral"
      - key: NOTIFICATION_CRON_TOKEN
        sync: false
databases:
  - name: digit-laboral-db-demo
    plan: free
