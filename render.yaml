services:
  - type: web
    name: digit-laboral-py-demo
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digit-laboral-db-demo
          property: connectionString
      - key: DIGIT_SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: Digit Laboral
      - key: ENVIRONMENT
        value: production
      - key: SECURE_COOKIES
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: FILES_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: digit-laboral-db-demo
    plan: free
    region: virginia
    databaseName: digit_laboral
    user: digit_laboral
    postgresMajorVersion: "17"
