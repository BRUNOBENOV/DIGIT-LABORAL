services:
  - type: web
    name: digit-laboral-app
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digit-laboral-db
          property: connectionString
      - key: DIGIT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SECURE_COOKIES
        value: "true"
databases:
  - name: digit-laboral-db
    plan: basic-256mb
