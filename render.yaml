services:
  - type: web
    name: digit-laboral-app
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digit-laboral-db-demo
          property: connectionString
      - key: DIGIT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: AI_ENABLED
        value: "true"
      - key: OPENAI_MODEL
        value: "gpt-5-mini"
      - key: AI_STORE_RESPONSES
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: MAX_LOGO_SIZE
        value: "2097152"
      - key: MAX_IMPORT_ROWS
        value: "2000"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: PASSWORD_RESET_MINUTES
        value: "30"
      - key: RLS_ENABLED
        value: "true"
      - key: CSRF_ENABLED
        value: "true"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: "Administrador General"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Digit Laboral"
databases:
  - name: digit-laboral-db-demo
    plan: free
