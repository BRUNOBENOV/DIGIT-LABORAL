<svg xmlns="http://www.w3.org/2000/svg" width="500" height="207" viewBox="0 0 500 207" role="img" aria-labelledby="title desc">
  <title id="title">Digit Laboral — logo blanco</title>
  <desc id="desc">Versión blanca del logotipo Digit Laboral, con fondo transparente y proporción 500 por 207.</desc>
  <g fill="#FFFFFF">
    <!-- Emblema D. El recorte interior deja ver el fondo oscuro de la barra lateral. -->
    <path fill-rule="evenodd" d="M10 10 H112 C165 10 201 48 201 103.5 C201 159 165 197 112 197 H10 Z M43 42 H111 L128 59 V134 Q128 138 124 138 H47 Q43 138 43 134 Z"/>
    <!-- Contorno del documento y líneas, todo en blanco puro. -->
    <path d="M44.5 43.5 H110.5 L126.5 59.5 V133.5 Q126.5 136.5 123.5 136.5 H47.5 Q44.5 136.5 44.5 133.5 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M111 44 V57 Q111 60 114 60 H126" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M56 83.5 H111 M56 104 H111 M56 123 H86" fill="none" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round"/>
    <!-- Wordmark editable. -->
    <text x="231" y="103" font-family="Inter Display, Inter, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="-1.2" transform="translate(231 0) scale(1.28 1) translate(-231 0)">Digit</text>
    <text x="232" y="180" font-family="Inter Display, Inter, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-1.5" textLength="255" lengthAdjust="spacingAndGlyphs">Laboral</text>
  </g>
</svg>
