{% macro section_card(title, eyebrow='', description='', class_name='') -%}
<section class="ui-section-card{% if class_name %} {{ class_name }}{% endif %}">
  <header class="ui-section-card-head">
    <div>{% if eyebrow %}<span class="eyebrow">{{ eyebrow }}</span>{% endif %}<h2>{{ title }}</h2>{% if description %}<p>{{ description }}</p>{% endif %}</div>
  </header>
  <div class="ui-section-card-body">{{ caller() }}</div>
</section>
{%- endmacro %}

{% macro inline_help(text, tone='muted') -%}
<small class="ui-inline-help ui-inline-help-{{ tone }}">{{ text }}</small>
{%- endmacro %}
