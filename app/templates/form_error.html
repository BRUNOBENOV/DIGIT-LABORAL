<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisá los datos | Digit Laboral</title><style>body{margin:0;background:#f3f6fb;color:#17243c;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #dce4ef;border-radius:20px;padding:28px;box-shadow:0 20px 55px rgba(21,45,89,.12)}h1{margin:0 0 8px;font-size:1.65rem}p{color:#62718a;line-height:1.55}.errors{display:grid;gap:8px;margin:20px 0}.error{background:#fff2f2;border:1px solid #f0c9cc;border-radius:10px;padding:11px;color:#8f2731;font-size:.9rem}.button{display:inline-flex;background:#245fc4;color:#fff;text-decoration:none;padding:11px 16px;border-radius:10px;font-weight:800}small{display:block;margin-top:18px;color:#8995a7}</style></head><body><main class="card"><h1>Hay datos que necesitan corrección</h1><p>No se guardó ningún cambio. Volvé al formulario, corregí los campos indicados y enviá nuevamente.</p><div class="errors">{% for message in messages %}<div class="error">{{ message }}</div>{% endfor %}</div><a class="button" href="{{ back }}">Volver al formulario</a>{% if request_id %}<small>Referencia técnica: {{ request_id }}</small>{% endif %}</main></body></html>
