services:
  - type: web
    name: digit-laboral-production
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: digit-laboral-production-db
          property: connectionString
      - key: DIGIT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: SECURE_COOKIES
        value: "true"
      - key: ALLOWED_HOSTS
        sync: false
      - key: JSON_LOGS
        value: "true"
      - key: RLS_ENABLED
        value: "true"
      - key: RLS_FORCE
        value: "true"
      - key: CSRF_ENABLED
        value: "true"
      - key: COMPLIANCE_DUAL_APPROVAL
        value: "true"
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: "Administrador General"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: "Digit Laboral"
      - key: AI_ENABLED
        value: "false"
      - key: REI_DIRECT_ENABLED
        value: "false"
      - key: REOP_DIRECT_ENABLED
        value: "false"
databases:
  - name: digit-laboral-production-db
    plan: basic-256mb
    databaseName: digit_laboral
    user: digit_laboral_owner
